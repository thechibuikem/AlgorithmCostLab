version: "3.9"

services:
  algorithm-cost-lab:
    build: .
    container_name: algorithm-cost-lab
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "1"
          memory: 1g
    volumes:
      - ./results:/app/results
